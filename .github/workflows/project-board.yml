# Keeps the user project board (https://github.com/users/jrose462/projects/5) in step with bug reports and fixes.
# Reported -> Planned -> Fix in PR -> Fixed -> Released. Status only ever moves forward.
#
# SAFETY: this workflow never runs Claude and never checks out or executes any repo or PR code. It only reads event
# metadata and calls the GitHub API. User-owned Projects v2 cannot be written with GITHUB_TOKEN, so it needs the secret
# PROJECT_TOKEN (classic PAT with `project` scope, or fine-grained with Projects read/write); without it every run is a
# green no-op with a notice.
#
# `pull_request_target` is used ONLY here, ONLY for metadata: it runs the workflow from main (not the PR), with secrets, even for
# fork PRs. That is safe because no step touches PR code or interpolates PR text into a script (values go through env vars,
# and are only used as numbers/ids). Fork PRs are ignored on `opened`/`reopened` (a fork could fake a claude/issue-<n> branch
# name or "Fixes #n"); a merged PR is handled for any origin because the owner merged it, and issues are taken from GitHub's own
# closingIssuesReferences, not from text parsing.
name: Project board

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed]
  release:
    types: [published]
  # Called by the bug-squash publish job: its comments/PRs are made with GITHUB_TOKEN, which never triggers workflows.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      status:
        description: planned | fix-in-pr | fixed | archive
        required: true
      pr:
        description: PR number (for fix-in-pr)
        required: false
        default: ''

permissions: {}

concurrency:
  group: project-board
  cancel-in-progress: false

jobs:
  board:
    name: Update project board
    if: >-
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '<!-- optimus-vibe:report v1 -->') ||
         (github.event.action == 'labeled' && github.event.label.name == 'bug-report')))
      ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        github.event.comment.user.type == 'Bot' &&
        contains(github.event.comment.body, '<!-- claude-bug-triage -->'))
      ||
      github.event_name == 'pull_request_target'
      ||
      (github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft)
      ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write          # "Shipped in vX" comment
      pull-requests: read    # closingIssuesReferences
    env:
      PROJECT_ID: PVT_kwHODlqD4M4BnbMW
      FIELD_ID: PVTSSF_lAHODlqD4M4BnbMWzhl_5hs
      OPT_REPORTED: 41794a82
      OPT_PLANNED: 6045a95f
      OPT_FIX_IN_PR: 06a6a91b
      OPT_FIXED: 5115a02b
      OPT_RELEASED: 7bbbcacf
    steps:
      - name: Update board
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE: ${{ github.event.issue.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IN_ISSUE: ${{ github.event.inputs.issue }}
          IN_STATUS: ${{ github.event.inputs.status }}
          IN_PR: ${{ github.event.inputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_TOKEN:-}" ]; then
            echo "::notice title=Project board inactive::Add a PROJECT_TOKEN secret to enable board automation (see docs/ci.md)."
            exit 0
          fi

          pgql() { GH_TOKEN="$PROJECT_TOKEN" gh api graphql "$@"; }

          rank() {
            case "$1" in
              "$OPT_REPORTED") echo 1 ;; "$OPT_PLANNED") echo 2 ;; "$OPT_FIX_IN_PR") echo 3 ;;
              "$OPT_FIXED") echo 4 ;; "$OPT_RELEASED") echo 5 ;; *) echo 0 ;;
            esac
          }

          # add_item <content node id> -> project item id (idempotent: returns the existing item)
          add_item() {
            pgql -f query='mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}' \
              -f p="$PROJECT_ID" -f c="$1" --jq '.data.addProjectV2ItemById.item.id'
          }

          cur_status() {
            pgql -f query='query($i:ID!){node(id:$i){... on ProjectV2Item{fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{optionId}}}}}' \
              -f i="$1" --jq '.data.node.fieldValueByName.optionId // ""'
          }

          # move_to <item id> <option id>: forward-only
          move_to() {
            local cur; cur=$(cur_status "$1")
            if [ "$(rank "$cur")" -ge "$(rank "$2")" ]; then echo "Item $1 already at or past target; leaving it."; return 0; fi
            pgql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
              -f p="$PROJECT_ID" -f i="$1" -f f="$FIELD_ID" -f o="$2" --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' >/dev/null
            echo "Item $1 -> $2"
          }

          issue_node() { gh api "repos/$GH_REPO/issues/$1" --jq '.node_id'; }

          # Issues closed by a PR: GitHub's own linkage, plus the claude/issue-<n> branch (same-repo only).
          linked_issue_nodes() {
            gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){closingIssuesReferences(first:10){nodes{id number}}}}}' \
              -f o="${GH_REPO%%/*}" -f r="${GH_REPO##*/}" -F n="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].id'
            if [ "$PR_HEAD_REPO" = "$GH_REPO" ] && [[ "$PR_HEAD_REF" =~ ^claude/issue-([0-9]+)$ ]]; then
              issue_node "${BASH_REMATCH[1]}"
            fi
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              [[ "$IN_ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue must be a number"; exit 1; }
              item=$(add_item "$(issue_node "$IN_ISSUE")")
              case "$IN_STATUS" in
                planned)   move_to "$item" "$OPT_PLANNED" ;;
                fixed)     move_to "$item" "$OPT_FIXED" ;;
                fix-in-pr) move_to "$item" "$OPT_FIX_IN_PR"
                           if [[ "$IN_PR" =~ ^[0-9]+$ ]]; then
                             move_to "$(add_item "$(gh api "repos/$GH_REPO/pulls/$IN_PR" --jq '.node_id')")" "$OPT_FIX_IN_PR"
                           fi ;;
                archive)   pgql -f query='mutation($p:ID!,$i:ID!){archiveProjectV2Item(input:{projectId:$p,itemId:$i}){item{id}}}' \
                             -f p="$PROJECT_ID" -f i="$item" --jq '.data.archiveProjectV2Item.item.id' >/dev/null
                           echo "Archived item for #$IN_ISSUE" ;;
                *) echo "::error::unknown status $IN_STATUS"; exit 1 ;;
              esac
              ;;
            issues)
              item=$(add_item "$ISSUE_NODE")
              move_to "$item" "$OPT_REPORTED"
              ;;
            issue_comment)
              item=$(add_item "$ISSUE_NODE")
              move_to "$item" "$OPT_PLANNED"
              ;;
            pull_request_target)
              if [ "$ACTION" = "closed" ] && [ "$PR_MERGED" != "true" ]; then
                echo "PR closed without merge; nothing to do."; exit 0
              fi
              if [ "$ACTION" != "closed" ] && [ "$PR_HEAD_REPO" != "$GH_REPO" ]; then
                echo "::notice::Ignoring fork PR on open (only same-repo PRs are linked on open)."; exit 0
              fi
              target="$OPT_FIX_IN_PR"; [ "$ACTION" = "closed" ] && target="$OPT_FIXED"
              nodes=$(linked_issue_nodes | sort -u)
              if [ -z "$nodes" ]; then echo "No linked issue; nothing to do."; exit 0; fi
              for n in $nodes; do
                move_to "$(add_item "$n")" "$target"
              done
              move_to "$(add_item "$PR_NODE")" "$target"
              ;;
            release)
              rows=$(pgql --paginate -f query='query($p:ID!,$endCursor:String){node(id:$p){... on ProjectV2{items(first:100,after:$endCursor){nodes{id fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{optionId}} content{__typename ... on Issue{number state repository{nameWithOwner}} ... on PullRequest{number state repository{nameWithOwner}}}} pageInfo{hasNextPage endCursor}}}}}' \
                       -f p="$PROJECT_ID" \
                       --jq ".data.node.items.nodes[] | select(.fieldValueByName.optionId == \"$OPT_FIXED\") | select(.content.repository.nameWithOwner == \"$GH_REPO\") | select(.content.state != \"OPEN\") | [.id, .content.__typename, .content.number] | @tsv")
              while IFS=$'\t' read -r item kind num; do
                [ -z "${item:-}" ] && continue
                move_to "$item" "$OPT_RELEASED"
                if [ "$kind" = "Issue" ]; then
                  gh issue comment "$num" --repo "$GH_REPO" --body "Shipped in $RELEASE_TAG — the app will update itself." || true
                fi
              done <<< "$rows"
              ;;
          esac
