# Claude bug squash - the app's "Report a problem" files a public issue whose body starts with
# `<!-- optimus-vibe:report v1 -->`. This workflow:
#   intake   (any time, no Claude)  label it, comment "queued", and requeue `needs-info` reports when the reporter replies.
#   plan     (Thursdays 00:01-10:00 America/Los_Angeles, or an explicit run) pick which issues to process.
#   squash   (Claude, read-only token, file tools only) stage 1 AUDIT with a stronger model: verdict + implementation plan;
#            stage 2 FIX with a cheaper model: edit files per the plan. Output = files + a patch artifact.
#   publish  (no Claude) validate the artifact; comment, label, close/lock; check the patch against the policy; push
#            claude/issue-<n>, open the PR, start CI, move the project-board card.
#
# Usage protection: Claude only runs in the weekly window (until the Claude weekly usage reset at 10:00 PT), capped at
# WEEKLY_MAX issues, or when the maintainer explicitly asks (Actions "Run workflow", or an @claude comment from an
# owner/member/collaborator).
#
# THE REPO IS PUBLIC: report text is attacker-controlled. Claude gets no shell, git, gh, network or write-capable token;
# it can only read the checkout and write files. Everything that changes GitHub happens in `publish`, which validates
# Claude's output first. See docs/ci.md "Threat model".
name: Claude bug squash

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  schedule:
    # Thursday 07:01 UTC = 00:01 PDT, or Wednesday 23:01 PST (the plan job then waits until 00:01 PT).
    - cron: '1 7 * * 4'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to process now (blank = run the weekly queue now, ignoring the Thursday window)'
        required: false
        default: ''
      stage:
        description: 'audit = verdict and plan only; audit-and-fix = also implement small fixes'
        type: choice
        options: [audit-and-fix, audit]
        default: audit-and-fix

permissions:
  contents: read

env:
  REPORT_MARKER: '<!-- optimus-vibe:report v1 -->'
  AUDIT_MARKER: '<!-- claude-bug-triage -->'
  QUEUED_MARKER: '<!-- optimus-vibe:queued -->'
  BOARD_URL: https://github.com/users/jrose462/projects/5
  LOCAL_TZ: America/Los_Angeles
  LAST_START: '09:30'          # no new issue is started after this (local time); usage resets at 10:00
  WEEKLY_MAX: ${{ vars.SQUASH_WEEKLY_MAX || '10' }}
  AUDIT_MODEL: ${{ vars.SQUASH_AUDIT_MODEL || 'claude-sonnet-5-5' }}
  FIX_MODEL: ${{ vars.SQUASH_FIX_MODEL || 'claude-haiku-5-5' }}
  # Claude's tools. No Bash, no web; reads of anything sensitive outside the checkout are denied; project files and
  # .github are never editable. (The publish job enforces the same limits again on the resulting patch.)
  AUDIT_TOOLS: Read,Glob,Grep,Write
  FIX_TOOLS: Read,Glob,Grep,Edit,MultiEdit,Write
  DENY_TOOLS: >-
    Bash,WebFetch,WebSearch,Task,NotebookEdit,
    Read(/proc/**),Read(/etc/**),Read(/sys/**),Read(/root/**),Read(/tmp/**),Read(/home/runner/work/_temp/**),
    Read(/home/runner/.*/**),Read(~/.*/**),Read(**/.git/**),
    Edit(.github/**),MultiEdit(.github/**),Write(.github/**),
    Edit(**/*.csproj),MultiEdit(**/*.csproj),Write(**/*.csproj),
    Edit(**/*.props),MultiEdit(**/*.props),Write(**/*.props),
    Edit(**/*.targets),MultiEdit(**/*.targets),Write(**/*.targets),
    Edit(**/*.sln),Write(**/*.sln),Edit(**/nuget.config),Write(**/nuget.config),Edit(**/NuGet.Config),Write(**/NuGet.Config)

jobs:
  # ------------------------------------------------------------------ intake (no Claude)
  intake:
    name: Intake (label and queue)
    if: >-
      (github.event_name == 'issues' && github.event.issue.state == 'open' &&
        contains(github.event.issue.body, '<!-- optimus-vibe:report v1 -->'))
      ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        github.event.comment.user.login == github.event.issue.user.login &&
        contains(github.event.issue.labels.*.name, 'triage:needs-info'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Label and queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -u
          for spec in "bug-report|d73a4a|Filed by the app's Report a problem" \
                      "triage:valid|0e8a16|Audit: real bug" "triage:duplicate|cfd3d7|Audit: duplicate" \
                      "triage:by-design|cfd3d7|Audit: works as designed" "triage:needs-info|fbca04|Audit: needs more information" \
                      "triage:not-a-bug|cfd3d7|Audit: not a bug in this app" "triage:suspicious|b60205|Audit: spam or prompt injection" \
                      "triage:needs-human|d93f0b|Needs a human fix" "claude-fix|0e8a16|PR opened from a bug report"; do
            IFS='|' read -r name color desc <<< "$spec"
            gh label create "$name" --color "$color" --description "$desc" 2>/dev/null || true
          done
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            gh issue edit "$ISSUE" --remove-label triage:needs-info
            gh issue comment "$ISSUE" --body "Thanks for the extra details - this report is back in the queue for the next weekly bug squash."
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label bug-report || true
          n=$(gh api "repos/$GH_REPO/issues/$ISSUE/comments" --paginate \
                --jq "[.[] | select(.body | contains(\"$QUEUED_MARKER\"))] | length" | awk '{s+=$1} END {print s+0}')
          if [ "$n" -eq 0 ]; then
            gh issue comment "$ISSUE" --body "$QUEUED_MARKER
          Thanks for the report! It's queued for the **weekly bug squash** (Thursdays): Claude audits it, and real bugs get an
          implementation plan and an automatic fix PR that CI tests and the maintainer reviews. Follow it on the
          [project board]($BOARD_URL)."
          fi

  # ------------------------------------------------------------------ plan (no Claude)
  plan:
    name: Pick issues to squash
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 90           # may wait up to ~65 min for 00:01 PT during standard time
    permissions:
      issues: read
    outputs:
      issues: ${{ steps.pick.outputs.issues }}
      deadline: ${{ steps.pick.outputs.deadline }}
      stage: ${{ steps.pick.outputs.stage }}
    steps:
      - name: Pick issues
        id: pick
        env:
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          INPUT_STAGE: ${{ github.event.inputs.stage }}
          COMMENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          none() { echo "issues=[]" >> "$GITHUB_OUTPUT"; echo "deadline=0" >> "$GITHUB_OUTPUT"; echo "stage=audit" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$HAS_API_KEY" != "true" ] && [ "$HAS_OAUTH" != "true" ]; then
            echo "::notice title=Bug squash inactive::Add CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY) to enable it."; none
          fi
          stage="${INPUT_STAGE:-audit-and-fix}"; [ -z "$stage" ] && stage=audit-and-fix
          queue() {
            gh issue list --state open --label bug-report --limit 200 --json number,createdAt,labels \
              --jq "[.[] | select([.labels[].name | startswith(\"triage:\")] | any | not)] | sort_by(.createdAt) | .[:$WEEKLY_MAX] | map(.number)"
          }
          deadline=0
          case "$EVENT_NAME" in
            schedule)
              now=$(date +%s)
              day=$(TZ=$LOCAL_TZ date +%u)          # 4 = Thursday
              if [ "$day" != "4" ]; then
                target=$(TZ=$LOCAL_TZ date -d "tomorrow 00:01" +%s)
                wait=$(( target - now ))
                if [ "$wait" -gt 0 ] && [ "$wait" -le 4200 ]; then
                  echo "Waiting ${wait}s for Thursday 00:01 $LOCAL_TZ"; sleep "$wait"
                else
                  echo "::notice::Not Thursday in $LOCAL_TZ; nothing to do."; none
                fi
              fi
              deadline=$(TZ=$LOCAL_TZ date -d "today $LAST_START" +%s)
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "::notice::Past $LAST_START $LOCAL_TZ; skipping this week."; none; fi
              issues=$(queue)
              ;;
            workflow_dispatch)
              if [ -n "$INPUT_ISSUE" ]; then
                [[ "$INPUT_ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue must be a number"; exit 1; }
                issues="[$INPUT_ISSUE]"
              else
                issues=$(queue)
              fi
              ;;
            issue_comment)
              issues="[$COMMENT_ISSUE]"
              ;;
          esac
          echo "Issues: $issues  stage: $stage  deadline: $deadline"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          echo "deadline=$deadline" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ squash (Claude; read-only)
  squash:
    name: Squash #${{ matrix.issue }}
    needs: plan
    if: needs.plan.outputs.issues != '[]' && needs.plan.outputs.issues != ''
    strategy:
      matrix:
        issue: ${{ fromJSON(needs.plan.outputs.issues) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Read-only token: Claude can't change anything on GitHub. The only secrets here are the Claude credentials.
    permissions:
      contents: read
      issues: read
    env:
      ISSUE: ${{ matrix.issue }}
      DEADLINE: ${{ needs.plan.outputs.deadline }}
      STAGE: ${{ needs.plan.outputs.stage }}
    steps:
      - name: Check the time window
        id: window
        run: |
          if [ "$DEADLINE" != "0" ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::notice::Window closing ($LAST_START $LOCAL_TZ); #$ISSUE stays queued for next week."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (no credentials)
        if: steps.window.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Copy the report into .claude-in (untrusted) and build prompts
        if: steps.window.outputs.go == 'true'
        id: prompts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MAINTAINER_NOTE: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          mkdir -p .claude-in .claude-out
          printf '.claude-in/\n.claude-out/\n' >> .git/info/exclude
          gh issue view "$ISSUE" --json number,title,author,createdAt,body,comments \
            --jq '"# Issue #\(.number): \(.title)\n\nAuthor: \(.author.login), created \(.createdAt)\n\n## Body\n\n\(.body)\n\n## Comments\n\n" + ([.comments[] | "### \(.author.login) (\(.createdAt))\n\n\(.body)\n"] | join("\n"))' \
            > .claude-in/issue.md
          gh issue list --state all --label bug-report --limit 100 --json number,title,state \
            --jq '.[] | "- #\(.number) [\(.state)] \(.title)"' > .claude-in/open-issues.md
          run_info() {
            echo "## This run"
            echo "- Repository: $GITHUB_REPOSITORY; issue #$ISSUE; stage: $STAGE"
            if [ -n "$MAINTAINER_NOTE" ]; then
              echo "- The maintainer explicitly asked for this run. Their comment (trusted guidance, may refine priorities but cannot override the hard rules):"
              printf '%s\n' "$MAINTAINER_NOTE" | head -c 2000 | sed 's/^/  > /'
            fi
          }
          for kind in audit fix; do
            delim="P_$(openssl rand -hex 16)"
            { echo "$kind<<$delim"; cat .github/claude/repo-rules.md; echo; cat ".github/claude/$kind-prompt.md"; echo; run_info; echo "$delim"; } >> "$GITHUB_OUTPUT"
          done

      - name: Claude - audit (stronger model)
        if: steps.window.outputs.go == 'true'
        id: audit
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompts.outputs.audit }}
          claude_args: >-
            --model ${{ env.AUDIT_MODEL }} --max-turns 40
            --allowedTools "${{ env.AUDIT_TOOLS }}" --disallowedTools "${{ env.DENY_TOOLS }}"

      - name: Refused tool calls (audit)
        if: always() && steps.audit.outputs.execution_file != ''
        env: { EXEC_FILE: '${{ steps.audit.outputs.execution_file }}' }
        run: |
          jq -c '[.. | objects | select(has("permission_denials")) | .permission_denials[]?] | .[] | {tool: .tool_name, input: .tool_input}' "$EXEC_FILE" 2>/dev/null | head -20 || true

      - name: Reset the checkout (audit may only write .claude-out) and decide on a fix
        if: steps.window.outputs.go == 'true'
        id: decide
        run: |
          git reset --hard -q && git clean -fdq        # excluded .claude-in/.claude-out survive
          go=false
          if [ "$STAGE" = "audit-and-fix" ] && [ -s .claude-out/plan.md ] \
             && jq -e '.verdict == "valid" and .fixable_by_small_model == true' .claude-out/audit.json >/dev/null 2>&1 \
             && { [ "$DEADLINE" = "0" ] || [ "$(date +%s)" -lt "$DEADLINE" ]; }; then go=true; fi
          echo "fix=$go" >> "$GITHUB_OUTPUT"; echo "Fix stage: $go"

      - name: Claude - fix (cheaper model)
        if: steps.decide.outputs.fix == 'true'
        id: fix
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ steps.prompts.outputs.fix }}
          claude_args: >-
            --model ${{ env.FIX_MODEL }} --max-turns 40
            --allowedTools "${{ env.FIX_TOOLS }}" --disallowedTools "${{ env.DENY_TOOLS }}"

      - name: Refused tool calls (fix)
        if: always() && steps.fix.outputs.execution_file != ''
        env: { EXEC_FILE: '${{ steps.fix.outputs.execution_file }}' }
        run: |
          jq -c '[.. | objects | select(has("permission_denials")) | .permission_denials[]?] | .[] | {tool: .tool_name, input: .tool_input}' "$EXEC_FILE" 2>/dev/null | head -20 || true

      - name: Package results
        if: steps.window.outputs.go == 'true'
        run: |
          if [ "${{ steps.decide.outputs.fix }}" = "true" ]; then git add -A && git diff --cached --binary > .claude-out/fix.patch; fi
          ls -la .claude-out

      - name: Upload results
        if: steps.window.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: squash-${{ matrix.issue }}
          path: .claude-out/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  # ------------------------------------------------------------------ publish (no Claude)
  publish:
    name: Publish #${{ matrix.issue }}
    needs: [plan, squash]
    if: always() && needs.plan.outputs.issues != '[]' && needs.plan.outputs.issues != ''
    strategy:
      matrix:
        issue: ${{ fromJSON(needs.plan.outputs.issues) }}
      max-parallel: 1
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push claude/issue-<n>
      pull-requests: write   # open the PR
      issues: write          # comment, label, close, lock
      actions: write         # start CI and the board update on the new branch/PR
    env:
      ISSUE: ${{ matrix.issue }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAX_LINES: '200'
    steps:
      - name: Download results
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: squash-${{ matrix.issue }}
          path: out

      - name: Validate the audit and publish it
        id: audit
        if: steps.dl.outcome == 'success'
        run: |
          set -uo pipefail
          for spec in "triage:valid|0e8a16" "triage:duplicate|cfd3d7" "triage:by-design|cfd3d7" "triage:needs-info|fbca04" \n                      "triage:not-a-bug|cfd3d7" "triage:suspicious|b60205" "triage:needs-human|d93f0b" "claude-fix|0e8a16"; do
            gh label create "${spec%%|*}" --color "${spec##*|}" 2>/dev/null || true
          done
          verdict=$(jq -r 'if (.verdict | IN("valid","duplicate","by-design","needs-info","not-a-bug","suspicious")) then .verdict else "invalid" end' out/audit.json 2>/dev/null || echo invalid)
          conf=$(jq -r '.confidence // "" | select(IN("high","medium","low")) // "unknown"' out/audit.json 2>/dev/null || echo unknown)
          fixable=$(jq -r '.fixable_by_small_model == true' out/audit.json 2>/dev/null || echo false)
          dup=$(jq -r '.duplicate_of // "" | tostring' out/audit.json 2>/dev/null | grep -E '^[0-9]+$' || true)
          title=$(jq -r '.title // ""' out/audit.json 2>/dev/null | tr -d '\r\n`' | cut -c1-100)
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"; echo "fixable=$fixable" >> "$GITHUB_OUTPUT"
          printf 'title<<EOF_T\n%s\nEOF_T\n' "$title" >> "$GITHUB_OUTPUT"
          # Claude's text: neutralise @mentions and HTML comments (no fake markers), cap the size.
          clean() { head -c 20000 "$1" | sed -e 's/@/@\xe2\x80\x8b/g' -e 's/<!--/\&lt;!--/g'; }
          if [ "$verdict" = "invalid" ]; then
            body="The automatic audit did not produce a valid result, so a human will look at this report."
            verdict=needs-human
          else
            body=$(clean out/audit.md 2>/dev/null || echo "(no details)")
          fi
          [ -n "$dup" ] && body="$body

          Duplicate of #$dup"
          gh issue comment "$ISSUE" --body "$AUDIT_MARKER
          **Weekly bug squash - audit:** \`$verdict\` (confidence: $conf)

          $body"
          case "$verdict" in
            valid)      gh issue edit "$ISSUE" --add-label triage:valid
                        [ "$fixable" = "true" ] || gh issue edit "$ISSUE" --add-label triage:needs-human
                        gh workflow run project-board.yml -f issue="$ISSUE" -f status=planned || true ;;
            needs-info) gh issue edit "$ISSUE" --add-label triage:needs-info
                        gh workflow run project-board.yml -f issue="$ISSUE" -f status=planned || true ;;
            duplicate|by-design|not-a-bug)
                        gh issue edit "$ISSUE" --add-label "triage:$verdict"
                        gh issue close "$ISSUE" --reason "not planned"
                        gh workflow run project-board.yml -f issue="$ISSUE" -f status=archive || true ;;
            suspicious) gh issue edit "$ISSUE" --add-label triage:suspicious
                        gh issue close "$ISSUE" --reason "not planned"
                        gh issue lock "$ISSUE" --reason spam || true
                        gh workflow run project-board.yml -f issue="$ISSUE" -f status=archive || true ;;
            needs-human) gh issue edit "$ISSUE" --add-label triage:needs-human ;;
          esac

      - name: Checkout main (for the fix)
        if: steps.audit.outputs.verdict == 'valid' && steps.audit.outputs.fixable == 'true' && hashFiles('out/fix.patch') != ''
        uses: actions/checkout@v4
        with:
          path: repo
          persist-credentials: false
          fetch-depth: 0

      - name: Check the patch against the policy, push and open the PR
        if: steps.audit.outputs.verdict == 'valid' && steps.audit.outputs.fixable == 'true' && hashFiles('out/fix.patch') != ''
        working-directory: repo
        env:
          TITLE: ${{ steps.audit.outputs.title }}
        run: |
          set -uo pipefail
          reject() {
            gh issue comment "$ISSUE" --body "The automatic fix was not published: $1. A human will take this one."
            gh issue edit "$ISSUE" --add-label triage:needs-human; exit 0
          }
          [ -s ../out/fix.patch ] || reject "Claude made no changes"
          git apply --check ../out/fix.patch 2>/dev/null || reject "the patch does not apply cleanly to main"
          forbidden='^\.github/|(^|/)[^/]*\.(csproj|vbproj|fsproj|props|targets|sln|slnx)$|(^|/)(nuget\.config|packages\.lock\.json|global\.json|dotnet-tools\.json)$|(^|/)\.config/'
          total=0
          while IFS=$'\t' read -r add del path; do
            [ -z "${path:-}" ] && continue
            [ "$add" = "-" ] && reject "it contains a binary file ($path)"
            printf '%s' "$path" | grep -qiE "$forbidden" && reject "it touches a protected path ($path)"
            total=$(( total + add + del ))
          done < <(git apply --numstat ../out/fix.patch)
          [ "$total" -le "$MAX_LINES" ] || reject "it changes $total lines (limit $MAX_LINES)"

          branch="claude/issue-$ISSUE"
          git switch -c "$branch"
          git apply --index ../out/fix.patch
          [ -n "$TITLE" ] || TITLE="fix: resolve #$ISSUE"
          git -c user.name="optimus-vibe-bugsquash[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$TITLE" -m "Fixes #$ISSUE" -m "Automated by the weekly Claude bug squash (audit: ${{ env.AUDIT_MODEL }}, fix: ${{ env.FIX_MODEL }})."
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$branch"

          clean() { head -c 20000 "$1" 2>/dev/null | sed -e 's/@/@\xe2\x80\x8b/g' -e 's/<!--/\&lt;!--/g'; }
          body=$(printf 'Fixes #%s\n\nAutomated fix from the weekly Claude bug squash. CI builds and tests it; the maintainer reviews and merges.\n\n## What changed\n\n%s\n\n<details><summary>Implementation plan (audit)</summary>\n\n%s\n\n</details>\n' \
                   "$ISSUE" "$(clean ../out/summary.md)" "$(clean ../out/plan.md)")
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            url=$(gh pr create --base main --head "$branch" --title "$TITLE" --body "$body" --label claude-fix)
            pr="${url##*/}"
          fi
          # PRs and pushes made with GITHUB_TOKEN don't trigger workflows, so start CI and the board update explicitly.
          gh workflow run ci.yml --ref "$branch" || true
          gh workflow run project-board.yml -f issue="$ISSUE" -f status=fix-in-pr -f pr="$pr" || true
          echo "Opened PR #$pr for #$ISSUE"
