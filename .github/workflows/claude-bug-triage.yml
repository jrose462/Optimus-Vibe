# Bug-report loop: the app's "Report a problem" files an issue on this public repo (as the signed-in GitHub user, or
# anonymously via the app's built-in issues-only token) whose body starts with the hidden marker
# `<!-- optimus-vibe:report v1 -->`. Claude reads it, posts an action plan, and (when the fix is clear and small) opens a PR
# from claude/issue-<n> that ci.yml then builds and tests on Windows. Repo owners/members/collaborators can also mention
# @claude in a comment to follow up.
#
# Hardening (the repo is public, so anyone can open issues and the marker is not secret): issue-triggered runs need the marker
# in the body; the workflow itself adds the `bug-report` label (non-collaborators can't label); the first step enforces a
# daily cap (5 triage runs per UTC day) and skips already-triaged issues BEFORE any Claude step. Comment-triggered runs need
# OWNER/MEMBER/COLLABORATOR. Issue text is untrusted data (see .github/claude/repo-rules.md).
#
# Inert until a secret exists: the "Check for Claude credentials" step looks at ANTHROPIC_API_KEY and
# CLAUDE_CODE_OAUTH_TOKEN; with neither set every later step is skipped and the run ends green with a notice.
# See docs/ci.md.
name: Claude bug triage

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # OIDC exchange for the Claude GitHub App token
  actions: read     # lets Claude read CI results on its PRs

concurrency:
  # One Claude run per issue at a time; a second event (e.g. `opened` + `labeled` for the same new issue) queues
  # behind the first and then sees the plan marker and skips.
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage bug report
    if: >-
      (github.event_name == 'issues' &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.body, '<!-- optimus-vibe:report v1 -->'))
      ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for Claude credentials
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAILY_CAP: '5'
          EVENT_NAME: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            # Already triaged? (the plan comment carries a marker) -> nothing to do, and it must not count against the cap.
            if [ "$EVENT_NAME" = "issues" ]; then
              n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
                    --jq '[.[] | select(.body | contains("<!-- claude-bug-triage -->"))] | length' | awk '{s+=$1} END {print s+0}')
              if [ "$n" -gt 0 ]; then
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Issue #$ISSUE already has a Claude action plan; mention @claude in a comment to re-run."
                exit 0
              fi
            fi
            # Daily cap: runs of this workflow started today (UTC) that were not skipped, including this one.
            today=$(date -u +%F)
            runs=$(gh run list --workflow claude-bug-triage.yml --created ">=$today" --limit 100 \
                      --json conclusion --jq '[.[] | select(.conclusion != "skipped")] | length' 2>/dev/null || echo 0)
            if [ "$runs" -gt "$DAILY_CAP" ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Daily triage cap reached::$runs runs today (cap $DAILY_CAP); skipping. Comment @claude tomorrow to retry."
            else
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude bug triage is inactive::Add an ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret to enable it (see docs/ci.md)."
          fi

      - name: Ensure the bug-report label
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'issues'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Reporters without write access can't set labels, so the workflow does it (needs issues: write).
          gh label create bug-report --color d73a4a --description "Filed by the app's Report a problem" 2>/dev/null || true
          gh issue edit "$ISSUE" --add-label bug-report || true

      - name: Skip if Claude already triaged this issue
        id: dedupe
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
                --jq '[.[] | select(.body | contains("<!-- claude-bug-triage -->"))] | length' | awk '{s+=$1} END {print s+0}')
          if [ "$n" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Issue #$ISSUE already has a Claude action plan; mention @claude in a comment to re-run."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true' && steps.dedupe.outputs.run != 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 8 (compile sanity checks only)
        if: steps.gate.outputs.enabled == 'true' && steps.dedupe.outputs.run != 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build triage prompt
        id: prompt
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'issues' && steps.dedupe.outputs.run == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          # Untrusted issue text goes through env vars, never through expression interpolation in this script. Claude reads the
          # issue body itself with `gh issue view`, so only the number/title/author are inlined here.
          delim="PROMPT_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delim"
            cat .github/claude/repo-rules.md
            echo
            cat .github/claude/bug-triage-prompt.md
            echo
            echo "## This run"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Issue: #$ISSUE_NUMBER (opened by @$ISSUE_AUTHOR)"
            echo "- Title (untrusted text): $(printf '%s' "$ISSUE_TITLE" | tr -d '\r\n' | head -c 200)"
            echo "- Branch for a fix: claude/issue-$ISSUE_NUMBER"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Claude triage (new bug report)
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'issues' && steps.dedupe.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,TodoWrite,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git push:*),Bash(git branch:*),Bash(git fetch:*),Bash(dotnet build:*),Bash(dotnet restore:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(wc:*)"

      - name: Claude follow-up (@claude comment)
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'issue_comment'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 60
            --append-system-prompt "Before acting, read and follow .github/claude/repo-rules.md (and .github/claude/bug-triage-prompt.md when the thread is a bug report). Linux runner: only compile-check with dotnet build -p:EnableWindowsTargeting=true; tests run in the Windows CI workflow on the PR."
            --allowedTools "Read,Glob,Grep,Edit,MultiEdit,Write,TodoWrite,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git push:*),Bash(git branch:*),Bash(git fetch:*),Bash(dotnet build:*),Bash(dotnet restore:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(wc:*)"
