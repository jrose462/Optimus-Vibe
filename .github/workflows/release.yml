# Cut a release: push a tag vX.Y.Z (or run manually with a version). Tests, publishes OptimusVibe.exe and
# optimus-vibe.exe as single-file self-contained win-x64 exes stamped with that version, writes a .sha256 per exe
# and creates the GitHub Release with generated notes. The in-app updater looks for exactly these asset names.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.3.0). Creates tag v<version> on the selected ref.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history + tags for the release notes

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $v = $env:INPUT_VERSION.Trim() -replace '^v', '' }
          else { $v = $env:REF_NAME -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Output "::error::Version '$v' is not X.Y.Z (tags must look like v1.2.3)."
            exit 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v"    >> $env:GITHUB_OUTPUT
          Write-Output "Releasing v$v"

      - name: Fail if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false   # non-zero exit from gh is the expected "not found"
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "::error::Release $env:TAG already exists."; exit 1 }
          $global:LASTEXITCODE = 0

      - name: Only release what is on main and passed CI
        # Changes reach main only through PRs (rulesets); this closes the other door: a tag on a side branch or on a
        # commit whose CI failed. Waits up to 20 min for CI that is still running on the merge commit.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$TAG points at ${SHA:0:7}, which is not on main. Merge the change through a pull request, then tag main."
            exit 1
          fi
          for i in $(seq 1 40); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
                   --jq '[.workflow_runs[] | {status, conclusion}]')
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then echo "CI passed on ${SHA:0:7}."; exit 0; fi
            if ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI has not passed on ${SHA:0:7} (runs: $(jq -c . <<<"$runs")). Fix main first."
              exit 1
            fi
            echo "CI still running on ${SHA:0:7}; waiting ($i/40)..."; sleep 30
          done
          echo "::error::Timed out waiting for CI on ${SHA:0:7}."; exit 1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OptimusVibe.sln

      - name: Build and test
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # Baked into the exes (obfuscated, see docs/ci.md): the owner's fine-grained, issues-only PAT for no-sign-in bug reports.
          BUG_REPORT_TOKEN: ${{ secrets.BUG_REPORT_TOKEN }}
        run: |
          dotnet build OptimusVibe.sln -c Release --no-restore "-p:Version=$env:VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test OptimusVibe.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-results-${{ github.run_id }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish single-file exes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUG_REPORT_TOKEN: ${{ secrets.BUG_REPORT_TOKEN }}
          # Optional override of the default OAuth client id in Directory.Build.props (repo variable, public value).
          CLIENT_ID: ${{ vars.OPTIMUSVIBE_GITHUB_CLIENT_ID }}
        run: |
          $common = @('-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
                      '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true',
                      "-p:Version=$env:VERSION")
          if ($env:CLIENT_ID) { $common += "-p:OptimusVibeGitHubClientId=$env:CLIENT_ID" }
          if (-not $env:BUG_REPORT_TOKEN) { Write-Output "::warning::BUG_REPORT_TOKEN is not set: this release can't send bug reports directly (it falls back to a browser form)." }
          dotnet publish src/OptimusVibe.App/OptimusVibe.App.csproj @common -o out/app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/OptimusVibe.Cli/OptimusVibe.Cli.csproj @common -o out/cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/app/OptimusVibe.exe dist/OptimusVibe.exe
          Copy-Item out/cli/optimus-vibe.exe    dist/optimus-vibe.exe

          foreach ($exe in Get-ChildItem dist -Filter *.exe) {
            $pv = $exe.VersionInfo.ProductVersion
            Write-Output "$($exe.Name): $([math]::Round($exe.Length / 1MB, 1)) MB, ProductVersion $pv"
            if (-not $pv.StartsWith($env:VERSION)) {
              Write-Output "::error::$($exe.Name) ProductVersion '$pv' does not start with $env:VERSION."
              exit 1
            }
          }

      - name: Collect license files
        run: |
          foreach ($f in 'THIRD_PARTY_NOTICES.md', 'LICENSE') {
            if (-not (Test-Path $f)) { Write-Output "::error::$f is missing from the repo root."; exit 1 }
            Copy-Item $f "dist/$f"
          }

      - name: Write SHA256 files
        run: |
          foreach ($exe in Get-ChildItem dist -Filter *.exe) {
            $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            # sha256sum format: "<hex>  <file name>", LF, no BOM
            [IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n")
            Write-Output "$hash  $($exe.Name)"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Write release notes from Conventional Commits
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Commits since the previous release tag, grouped by Conventional Commit type. Squash-merged PRs keep their
          # (conventional) PR title as the commit subject, so PRs land in the right section too.
          prev=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          range="${prev:+$prev..}HEAD"
          git log "$range" --no-merges --format='%H%x09%s%x09%b%x1e' > /tmp/commits.txt
          declare -A title=( [breaking]="Breaking changes" [feat]="Features" [fix]="Bug fixes" [perf]="Performance"
                             [refactor]="Refactoring" [docs]="Documentation" [style]="Style" [test]="Tests"
                             [ci]="CI and automation" [build]="Build" [chore]="Maintenance" [other]="Other changes" )
          order=(breaking feat fix perf refactor docs style test ci build chore other)
          declare -A body
          cc_re='^([a-z]+)(\(([^)]+)\))?(!)?: (.*)$'
          while IFS=$'\t' read -r -d $'\x1e' sha subject rest; do
            sha=$(printf '%s' "$sha" | tr -d '\n'); [ -z "$sha" ] && continue
            if [[ "$subject" =~ $cc_re ]]; then
              type="${BASH_REMATCH[1]}"; scope="${BASH_REMATCH[3]}"; bang="${BASH_REMATCH[4]}"; text="${BASH_REMATCH[5]}"
            else
              type=other; scope=""; bang=""; text="$subject"
            fi
            [[ -n "${title[$type]:-}" ]] || type=other
            line="- ${scope:+**$scope:** }$text ([\`${sha:0:7}\`](https://github.com/$REPO/commit/$sha))"
            if [ -n "$bang" ] || grep -q '^BREAKING CHANGE:' <<<"$rest"; then body[breaking]+="$line"$'\n'; fi
            body[$type]+="$line"$'\n'
          done < /tmp/commits.txt
          {
            echo "## What's new in $TAG"
            echo
            for t in "${order[@]}"; do
              [ -n "${body[$t]:-}" ] || continue
              echo "### ${title[$t]}"; echo; printf '%s\n' "${body[$t]}"
            done
            echo "Install or update: download \`OptimusVibe.exe\` below (each file has a \`.sha256\`), or let the app update itself."
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          # On a tag push the tag already exists; on workflow_dispatch gh creates it at the run's commit.
          gh release create $env:TAG `
            dist/OptimusVibe.exe dist/OptimusVibe.exe.sha256 `
            dist/optimus-vibe.exe dist/optimus-vibe.exe.sha256 `
            dist/THIRD_PARTY_NOTICES.md dist/LICENSE `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:TARGET `
            --title $env:TAG `
            --notes-file release-notes.md `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
