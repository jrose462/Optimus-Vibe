# Build and test on Windows for every push to main and every pull request (including PRs opened by Claude
# from the bug-triage workflow). See docs/ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Defence in depth next to branch protection + CODEOWNERS: only the repo owner may change .github/** (workflows, prompts),
  # except that Dependabot may move a commit pin on an existing `uses:` line. Those PRs still need the owner's review.
  # Uses the read-only GITHUB_TOKEN and the REST API only; it never checks out or runs PR code.
  protect-github-dir:
    name: Protect .github
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if a non-owner PR touches .github/**
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          files=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          hits=$(printf '%s\n' "$files" | grep -iE '^\.github/' || true)
          if [ -z "$hits" ]; then echo "No .github/** changes."; exit 0; fi
          if [ "${AUTHOR,,}" = "${OWNER,,}" ]; then
            echo "::notice::PR touches .github/** and is authored by the repo owner; allowed."; exit 0
          fi
          if [ "$AUTHOR" = "dependabot[bot]" ] && [ "$HEAD_REPO" = "$GH_REPO" ]; then
            other=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[] | select(.status != "modified" or .patch == null or (.filename | test("^[.]github/workflows/[^/]+[.]ya?ml$") | not)) | .filename')
            patches=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[] | .patch // empty')
            changed=$(printf '%s\n' "$patches" | grep -E '^[-+]' || true)
            pin='^[-+] *(- )?uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}( # [^ ]+)?$'
            action() { printf '%s\n' "$changed" | grep -E "^[$1]" | sed -E 's/^.//; s/@[0-9a-f]{40}.*$//'; }
            if [ -z "$other" ] && [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$pin" && [ "$(action -)" = "$(action +)" ]; then
              echo "::notice::Dependabot PR only moves commit pins on existing uses: lines; allowed."; exit 0
            fi
          fi
          echo "::error::Only the repository owner may change .github/** (Dependabot may only move uses: pins). Touched:"
          printf '%s\n' "$hits"
          exit 1

  build-test:
    name: Build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OptimusVibe.sln

      - name: Build (Release)
        run: dotnet build OptimusVibe.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test OptimusVibe.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit subject, and release notes are grouped from those subjects.
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|refactor|docs|style|test|ci|build|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(handlers): keep CRLF in XML files' (got: $TITLE)"
            exit 1
          fi