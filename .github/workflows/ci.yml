# Build and test on Windows for every push to main and every pull request (including PRs opened by Claude
# from the bug-triage workflow). See docs/ci.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Defence in depth next to branch protection + CODEOWNERS: only the repo owner may change .github/** (workflows, prompts).
  # Uses the read-only GITHUB_TOKEN and the REST API only; it never checks out or runs PR code.
  protect-github-dir:
    name: Protect .github
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if a non-owner PR touches .github/**
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          files=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          hits=$(printf '%s\n' "$files" | grep -iE '^\.github/' || true)
          if [ -z "$hits" ]; then echo "No .github/** changes."; exit 0; fi
          if [ "${AUTHOR,,}" = "${OWNER,,}" ]; then
            echo "::notice::PR touches .github/** and is authored by the repo owner; allowed."; exit 0
          fi
          echo "::error::Only the repository owner may change .github/**. Touched:"
          printf '%s\n' "$hits"
          exit 1

  build-test:
    name: Build and test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OptimusVibe.sln

      - name: Build (Release)
        run: dotnet build OptimusVibe.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test OptimusVibe.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit subject, and release notes are grouped from those subjects.
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|perf|refactor|docs|style|test|ci|build|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(handlers): keep CRLF in XML files' (got: $TITLE)"
            exit 1
          fi